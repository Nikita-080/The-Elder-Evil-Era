#textdomain The-Elder-Evil-Era
[unit_type]
    id=BC_Bloodsucker
    name= _ "Bloodsucker"
    race=undead
    gender=male,female
    image="units/Blood_Cult/Bloodsucker.png"
    hitpoints=28
    movement_type=elusivefoot
    movement=7
    experience=50
    level=1
    alignment=chaotic
    advances_to=null
    cost=16
    usage=fighter
    description= _ "Strange creatures are sometimes seen near mountains and swamps where people in red clothes meet. They hide in the night, attacking travelers and livestock, and all to quench their thirst for blood. When the peasants killed one of these creatures, they were horrified when they looked at it closer... It was a man. With fangs and claws, pale green skin, wild eyes, but still human."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/Blood_Cult/Bloodsucker.png" "units/Blood_Cult/Bloodsucker.png" {SOUND_LIST:HUMAN_HIT} }
    [resistance]
        blade=100
        pierce=100
        impact=100
        fire=100
        cold=100
        arcane=110
    [/resistance]
    [attack]
        name=fangs
        description=_"fangs"
        
        type=pierce
        range=melee
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    
    [female]
        name= _ "Bloodsucker"
        gender=female
        image="units/Blood_Cult/Bloodsucker.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {DEFENSE_ANIM "units/Blood_Cult/Bloodsucker.png" "units/Blood_Cult/Bloodsucker.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
        
    [/female]
[/unit_type]

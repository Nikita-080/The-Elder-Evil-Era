#textdomain The-Elder-Evil-Era
[unit_type]
    id=BC_Blood_Archer
    name= _ "Blood Archer"
    race=human
    gender=female
    image="units/Blood_Cult/Blood_Archer.png"
    hitpoints=55
    movement_type=smallfoot
    movement=5
    experience=140
    level=3
    alignment=chaotic
    advances_to=null
    cost=62
    usage=archer
    description= _ "Only the strongest female warriors with the most experience receive the title of blood archers. Their appearance portends many deaths from blades, poisons and fire. In the name of a cult, they can set entire villages on fire, paying tribute to their dark gods."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/Blood_Cult/Blood_Archer.png" "units/Blood_Cult/Blood_Archer.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [attack]
        name=dagger
        description=_"dagger"
        icon=attacks/dagger-orcish.png
        type=blade
        range=melee
        damage=15
        number=1
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=bow
        description=_"bow"
        icon=attacks/bow-orcish.png
        type=pierce
        range=ranged
        damage=13
        number=4
    [/attack]
    [attack]
        name=fire_bow
        description=_"fire bow"
        icon=attacks/bow-orcish.png
        type=fire
        range=ranged
        damage=12
        number=3
    [/attack]
    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        start_time=-445
        {SOUND:HIT_AND_MISS bow.ogg bow-miss.ogg -230}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        offset="0~0.6:200,0.6~0:200"
        start_time=-275
        {SOUND:HIT_AND_MISS knife.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=fire_bow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-fire-n.png"
            image_diagonal="projectiles/missile-fire-ne.png"
        [/missile_frame]
        [if]
            hits=no
        [/if]
        [else]
            hits=yes

            missile_offset=0~0.8:150
            {FIRE_BURST_SMALL}
        [/else]
        start_time=-445
        {SOUND:HIT_AND_MISS bow-puny-fire.ogg bow-puny-fire-miss.ogg -230}
    [/attack_anim]
[/unit_type]
